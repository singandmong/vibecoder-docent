name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check committed assets
        run: git diff --exit-code -- app/assets
      - run: node --test tests/*.test.mjs
      - run: npm pack --dry-run

  windows:
    name: Node 24 / windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 가짜 omp, herdr 를 shebang 스크립트로 만들어 서버에 물리는 테스트는 Windows 에서 실행할 수 없어 뺀다.
      # server-process 테스트가 실제 `docent start` 로 Windows 의 서버 시작과 세션 id 를 확인한다.
      - name: Tests without POSIX script fixtures
        shell: bash
        run: node --test $(ls tests/*.test.mjs | grep -v -E '/(ask|doctor|herdr-launch|models|terminal)\.test\.mjs$')
