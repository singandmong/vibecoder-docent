name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate tag and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${version}`);
          }
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex(line => line.startsWith(`## [${version}]`));
          if (start < 0) throw new Error(`Missing changelog section for ${version}`);
          const next = lines.findIndex((line, index) => index > start && line.startsWith('## ['));
          const notes = lines.slice(start, next < 0 ? undefined : next).join('\n').trim();
          writeFileSync('release-notes.md', `${notes}\n`);
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_ARCHIVE=${name}-${version}.tgz\n`);
          NODE
      - run: npm ci
      - run: npm run build
      - name: Check committed assets
        run: git diff --exit-code -- app/assets
      - run: node --test tests/*.test.mjs
      - name: Pack release archives
        run: |
          npm pack
          cp "$RELEASE_ARCHIVE" vibecoder-docent.tgz
      - name: Publish or replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" vibecoder-docent.tgz --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" vibecoder-docent.tgz \
              --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi

  macos-app:
    # 앱은 npm 패키지 뒤에 같은 릴리스에 붙인다. Apple Silicon 과 Intel 을 각자의 러너에서 만든다 (ADR 0073).
    needs: release
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ad-hoc signed app
        run: npm run build:macos -- --output "dist/Vibecoder Docent.app"
      - name: Check architecture and signature
        run: |
          file "dist/Vibecoder Docent.app/Contents/MacOS/Vibecoder Docent" | grep -q "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          codesign --verify --deep --strict "dist/Vibecoder Docent.app"
      - name: Zip and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          zip="Vibecoder-Docent-${version}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent "dist/Vibecoder Docent.app" "$zip"
          gh release upload "$RELEASE_TAG" "$zip" --clobber
